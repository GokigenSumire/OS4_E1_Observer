plugins { id 'com.android.application' }
android {
    namespace 'personal.wallpaper.os4.e1'
    compileSdk 37
    buildToolsVersion '37.0.0'
    defaultConfig {
        applicationId 'personal.wallpaper.os4.e1'
        minSdk 31
        targetSdk 37
        versionCode 97
        versionName '1.1.22-gesture-continuity'
    }
    signingConfigs {
        formal {
            def signingPath=System.getenv('KEYSTORE_FILE')
            if(signingPath){
                storeFile file(signingPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'; versionNameSuffix '-debug'
            buildConfigField 'String', 'WALLPAPER_APPLICATION_ID', '"personal.wallpaper.os3.debug"'
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            buildConfigField 'String', 'WALLPAPER_APPLICATION_ID', '"personal.wallpaper.os3"'
            signingConfig signingConfigs.formal
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    compileOnly files('libs/xposed-api-82.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
// AGP9.4当前默认只建立debug单测组件；正式profile必须显式启用自己的单测。
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        variant.enableUnitTest = true
    }
}
